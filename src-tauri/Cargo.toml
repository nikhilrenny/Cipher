[package]
name = "cipher"
version = "0.1.0"
description = "Cipher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
crypto_box = { version = "0.9", features = ["std"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sysinfo = "0.32"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
heic = "0.1"
pdfium-render = "0.9"
open = "5"
git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-openssl"] }
notify = "6.1"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
walkdir = "2.4"
chrono = "0.4"
# Phase 2.5 & 3: Key backup & git integration
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
rand = "0.8"
trash = "3"
ffmpeg-next = { version = "7", optional = true }

[features]
video-thumbnails = ["dep:ffmpeg-next"]

[[bin]]
name = "cipher"
path = "src/main.rs"
